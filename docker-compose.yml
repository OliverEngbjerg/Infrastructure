services:
    nginxproxymanager:
        image: "jc21/nginx-proxy-manager:latest"
        container_name: nginxproxymanager
        restart: unless-stopped
        ports:
            - "80:80"
            - "81:81"
            - "443:443"
        volumes:
            - nginxproxymanager_data:/data
            - ./nginx/letsencrypt:/etc/letsencrypt

    ddnsupdater:
        image: qmcgaw/ddns-updater
        container_name: ddnsupdater
        restart: unless-stopped
        environment:
            - PERIOD=5m
            - 'CONFIG={"settings":[{"provider":"porkbun","domain":"engbjerg.com","host":"@","api_key":"${PORKBUN_API_KEY}","secret_api_key":"${PORKBUN_SECRET_KEY}","ip_version":"ipv4"}]}'

    watchtower:
        image: nickfedor/watchtower
        container_name: watchtower
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=300
            - WATCHTOWER_LABEL_ENABLE=true

    ntfy:
        image: binwiederhier/ntfy
        container_name: ntfy
        restart: unless-stopped
        command: serve
        environment:
            TZ: Europe/Copenhagen
            NTFY_BASE_URL: https://ntfy.engbjerg.com
            NTFY_BEHIND_PROXY: "true"
            NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
            NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
            NTFY_AUTH_DEFAULT_ACCESS: deny-all
            NTFY_ENABLE_LOGIN: "true"
            NTFY_REQUIRE_LOGIN: "true"
            NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
            NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:?set NTFY_AUTH_USERS (user:bcrypt-hash:role) in the Portainer stack env vars}
        volumes:
            - ntfy_data:/var/lib/ntfy
        # Internal port: 80

    ntfybridge:
        image: "ghcr.io/oliverengbjerg/ntfybridge:latest"
        pull_policy: always
        container_name: ntfybridge
        restart: unless-stopped
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        environment:
            TZ: Europe/Copenhagen
            Ntfy__Token: ${NTFYBRIDGE_NTFY_TOKEN:?set NTFYBRIDGE_NTFY_TOKEN (ntfy tk_... token with write access to the github topic) in the Portainer stack env vars}
            Sources__GitHub__Token: ${NTFYBRIDGE_GITHUB_TOKEN:?set NTFYBRIDGE_GITHUB_TOKEN (GitHub classic PAT with the notifications scope) in the Portainer stack env vars}
        volumes:
            - ntfybridge_data:/data
        # Internal port: 8080 (health only, nothing to proxy)

    dashboard:
        image: "ghcr.io/oliverengbjerg/dashboard:latest"
        pull_policy: always
        container_name: dashboard
        restart: unless-stopped
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        # Internal port: 3000

    idlerpg:
        image: "ghcr.io/frederikja163/idlerpg:latest"
        pull_policy: always
        container_name: idlerpg
        restart: unless-stopped
        ports:
            - "4022:22"
            - "4000:4000"
        environment:
            - SSH_USER=${IDLERPG_SSH_USER}
            - SSH_PUBLIC_KEY=${IDLERPG_SSH_PUBLIC_KEY}
            - TLS_CERT_PATH=/certs/live/npm-2/fullchain.pem
            - TLS_KEY_PATH=/certs/live/npm-2/privkey.pem
            - ADMIN_PASSWORD=${IDLERPG_ADMIN_PASSWORD}
        volumes:
            - ./nginx/letsencrypt:/certs:ro
            - idle-rpg-data:/usr/src/idle-rpg/src/back-end/core/db

    jellyfin:
        image: linuxserver/jellyfin:latest
        container_name: jellyfin
        restart: unless-stopped
        ports:
            - "8096:8096"
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - jellyfin_config:/config
            - "/media/SeagateHub/Film og serier/Film:/data/Film"
            - "/media/SeagateHub/Film og serier/Serier:/data/Serier"

    caddy:
        image: caddy:alpine
        container_name: caddy
        restart: unless-stopped
        volumes:
            - ./caddy_data:/data
            - ./caddy_config:/config
            - ./oliver-files:/usr/share/caddy
        command: caddy file-server --browse --root /usr/share/caddy --listen :80

    # CalDAV/CardDAV server. Reached via NPM at radicale:5232 (no host port).
    # Config and htpasswd users are mounted from the inline `configs:` at the bottom.
    # RADICALE_USERS is a Portainer stack env var holding a "user:bcrypt-hash" line.
    # In Portainer, wrap the value in SINGLE QUOTES ('user:$2b$12$...') - otherwise
    # Compose expands the $-parts of the hash as variables and corrupts it.
    # No read_only here: Compose injects inline configs with `docker cp`, which
    # Docker refuses on a read-only rootfs (container is left in "Created").
    radicale:
        image: tomsquest/docker-radicale:latest
        container_name: radicale
        restart: unless-stopped
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
            - KILL
        environment:
            # Named volume already has uid 2999 ownership; skip the entrypoint's chown -R
            - TAKE_FILE_OWNERSHIP=false
        configs:
            - source: radicale_config
              target: /config/config
            - source: radicale_users
              target: /config/users
        volumes:
            - radicale_data:/data

    # PostgreSQL. Adopted 2026-09 from a bare `docker run` that carried no
    # compose labels, so this stack could not see or manage it.
    #
    # PGDATA is an ABSOLUTE HOST BIND MOUNT on purpose:
    #   * the directory predates this stack and holds ~246 GB of live data
    #   * a RELATIVE path would resolve against /data/compose/6, not the git
    #     checkout, and would silently initdb an EMPTY cluster
    #   * a named volume cannot be used: `postgres_storage` already exists on
    #     the obsolete local-persist driver and Docker will not change the
    #     driver of an existing volume
    # If you ever change this path, check it twice. A wrong path does not
    # error - the entrypoint initdb's a NEW EMPTY cluster instead.
    #
    # Deliberately NOT watchtower-labelled: image moves must stay manual so a
    # major version bump can never happen by surprise and eat the cluster.
    postgres:
        # Pinned to the digest already running (14.21, trixie, glibc 2.41) so
        # adopting into compose cannot also change the binary. The version bump
        # is a separate, deliberate commit.
        image: postgres@sha256:b964c3211689ffe50cc65235ea338717520954dcf6ecd4d76bf887eba3cbc91f
        container_name: postgres # zitadel (stack 12) resolves this name on stack_default
        restart: unless-stopped
        # The entrypoint treats SIGTERM as a "smart" shutdown that WAITS for
        # clients to disconnect, overruns the grace period and gets SIGKILLed -
        # which is why the last restart went through crash recovery. SIGINT is a
        # fast shutdown: disconnect clients, checkpoint, exit cleanly.
        stop_signal: SIGINT
        stop_grace_period: 5m
        shm_size: 1gb # Docker's 64MB default is too small for parallel query
        ports:
            # LAN address only, NEVER 0.0.0.0. ufw does not filter Docker
            # published ports (the DOCKER-USER chain is empty), so 0.0.0.0 here
            # means "internet-exposed the moment anything forwards 5432" - which
            # is exactly how this server absorbed 202k brute-force attempts in
            # Sept 2026. 192.168.1.23 is static in /etc/netplan/99_config.yaml.
            - "192.168.1.23:5432:5432"
        environment:
            TZ: Europe/Copenhagen
            # INERT on an existing PGDATA - the entrypoint only reads this when
            # it runs initdb on an empty directory. Rotate the real password
            # with ALTER ROLE, not by changing this value.
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Portainer stack env vars (wrap in SINGLE quotes if it contains $)}
        volumes:
            - /home/oliver/docker/volumes/postgres_storage:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q -U postgres -d postgres"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

