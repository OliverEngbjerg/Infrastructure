services:
    nginxproxymanager:
        image: "jc21/nginx-proxy-manager:latest"
        pull_policy: always
        container_name: nginxproxymanager
        restart: unless-stopped
        ports:
            - "80:80"
            - "81:81"
            - "443:443"
        volumes:
            - nginxproxymanager_data:/data
            - ./nginx/letsencrypt:/etc/letsencrypt

    ddnsupdater:
        image: qmcgaw/ddns-updater
        pull_policy: always
        container_name: ddnsupdater
        restart: unless-stopped
        environment:
            - PERIOD=5m
            - 'CONFIG={"settings":[{"provider":"porkbun","domain":"engbjerg.com","host":"@","api_key":"${PORKBUN_API_KEY}","secret_api_key":"${PORKBUN_SECRET_KEY}","ip_version":"ipv4"}]}'

    watchtower:
        image: nickfedor/watchtower
        pull_policy: always
        container_name: watchtower
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=300
            - WATCHTOWER_LABEL_ENABLE=true

    ntfy:
        image: binwiederhier/ntfy
        pull_policy: always
        container_name: ntfy
        restart: unless-stopped
        command: serve
        environment:
            TZ: Europe/Copenhagen
            NTFY_BASE_URL: https://ntfy.engbjerg.com
            NTFY_BEHIND_PROXY: "true"
            NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
            NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
            NTFY_AUTH_DEFAULT_ACCESS: deny-all
            NTFY_ENABLE_LOGIN: "true"
            NTFY_REQUIRE_LOGIN: "true"
            NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
            NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:?set NTFY_AUTH_USERS (user:bcrypt-hash:role) in the Portainer stack env vars}
        volumes:
            - ntfy_data:/var/lib/ntfy
        # Internal port: 80

    ntfybridge:
        image: "ghcr.io/oliverengbjerg/ntfybridge:latest"
        pull_policy: always
        container_name: ntfybridge
        restart: unless-stopped
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        environment:
            TZ: Europe/Copenhagen
            Ntfy__Token: ${NTFYBRIDGE_NTFY_TOKEN:?set NTFYBRIDGE_NTFY_TOKEN (ntfy tk_... token with write access to the github topic) in the Portainer stack env vars}
            Sources__GitHub__Token: ${NTFYBRIDGE_GITHUB_TOKEN:?set NTFYBRIDGE_GITHUB_TOKEN (GitHub classic PAT with the notifications scope) in the Portainer stack env vars}
        volumes:
            - ntfybridge_data:/data
        # Internal port: 8080 (health only, nothing to proxy)

    dashboard:
        image: "ghcr.io/oliverengbjerg/dashboard:latest"
        pull_policy: always
        container_name: dashboard
        restart: unless-stopped
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        # Internal port: 3000

    idlerpg:
        image: "ghcr.io/frederikja163/idlerpg:latest"
        pull_policy: always
        container_name: idlerpg
        restart: unless-stopped
        ports:
            - "4022:22"
            - "4000:4000"
        environment:
            - SSH_USER=${IDLERPG_SSH_USER}
            - SSH_PUBLIC_KEY=${IDLERPG_SSH_PUBLIC_KEY}
            - TLS_CERT_PATH=/certs/live/npm-2/fullchain.pem
            - TLS_KEY_PATH=/certs/live/npm-2/privkey.pem
            - ADMIN_PASSWORD=${IDLERPG_ADMIN_PASSWORD}
        volumes:
            - ./nginx/letsencrypt:/certs:ro
            - idle-rpg-data:/usr/src/idle-rpg/src/back-end/core/db

    jellyfin:
        image: linuxserver/jellyfin:latest
        pull_policy: always
        container_name: jellyfin
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - jellyfin_config:/config
            - "/media/SeagateHub/Film og serier/Film:/data/Film"
            - "/media/SeagateHub/Film og serier/Serier:/data/Serier"
            - "/media/SeagateHub/Film og serier/Healthcheck:/data/Healthcheck"

    # Media pipeline: Seerr takes requests, Prowlarr feeds indexers to Sonarr/Radarr, qBittorrent
    # downloads into Incoming where the PC encoder re-encodes to Encoded (B), Sonarr/Radarr import
    # into the library, Bazarr fetches subtitles.
    # Admin UIs are LAN only; Seerr is public through NPM (seerr.engbjerg.com -> seerr:5055).
    sonarr:
        image: lscr.io/linuxserver/sonarr:latest
        pull_policy: always
        container_name: sonarr
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - sonarr_config:/config
            - "/media/SeagateHub/Film og serier:/data"

    radarr:
        image: lscr.io/linuxserver/radarr:latest
        pull_policy: always
        container_name: radarr
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - radarr_config:/config
            - "/media/SeagateHub/Film og serier:/data"

    bazarr:
        image: lscr.io/linuxserver/bazarr:latest
        pull_policy: always
        container_name: bazarr
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - bazarr_config:/config
            - "/media/SeagateHub/Film og serier:/data"

    prowlarr:
        image: lscr.io/linuxserver/prowlarr:latest
        pull_policy: always
        container_name: prowlarr
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - prowlarr_config:/config

    qbittorrent:
        image: lscr.io/linuxserver/qbittorrent:latest
        pull_policy: always
        container_name: qbittorrent
        restart: unless-stopped
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
            - WEBUI_PORT=8085
        volumes:
            - qbittorrent_config:/config
            - "/media/SeagateHub/Film og serier:/data"
        networks:
            - default
            - qbt_gate

    # Stops downloads (tag waiting-for-space) until MIN_FREE_GB would still be free after them.
    # qBittorrent lets 10.89.12.2 in without a password (WebUI AuthSubnetWhitelist).
    qbittorrent-space-gate:
        image: python:3.13-alpine
        pull_policy: always
        container_name: qbittorrent-space-gate
        restart: unless-stopped
        command: ["python3", "-u", "/space_gate.py"]
        environment:
            - MIN_FREE_GB=40
        configs:
            - source: qbittorrent_space_gate
              target: /space_gate.py
        volumes:
            - "/media/SeagateHub/Film og serier:/data:ro"
        networks:
            qbt_gate:
                ipv4_address: 10.89.12.2

    seerr:
        image: ghcr.io/seerr-team/seerr:v3
        pull_policy: always
        container_name: seerr
        restart: unless-stopped
        init: true
        environment:
            - TZ=Europe/Copenhagen
            - LOG_LEVEL=info
        volumes:
            - seerr_config:/app/config

    caddy:
        image: caddy:alpine
        pull_policy: always
        container_name: caddy
        restart: unless-stopped
        volumes:
            - ./caddy_data:/data
            - ./caddy_config:/config
            - ./oliver-files:/usr/share/caddy
        command: caddy file-server --browse --root /usr/share/caddy --listen :80

    radicale:
        image: tomsquest/docker-radicale:latest
        pull_policy: always
        container_name: radicale
        restart: unless-stopped
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
            - KILL
        environment:
            # Named volume already has uid 2999 ownership; skip the entrypoint's chown -R
            - TAKE_FILE_OWNERSHIP=false
        configs:
            - source: radicale_config
              target: /config/config
            - source: radicale_users
              target: /config/users
        volumes:
            - radicale_data:/data

    postgres:
        image: postgres:18-trixie
        container_name: postgres
        restart: unless-stopped
        stop_signal: SIGINT
        stop_grace_period: 5m
        shm_size: 1gb
        ports:
            - "192.168.1.23:5432:5432"
        environment:
            TZ: Europe/Copenhagen
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Portainer stack env vars (wrap in SINGLE quotes if it contains $)}
        volumes:
            - /home/oliver/docker/postgres/data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q -U postgres -d postgres"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

    zitadel:
        image: ghcr.io/zitadel/zitadel:v4.17.3
        container_name: zitadel
        restart: unless-stopped
        user: "0"
        command: start-from-init --masterkeyFromEnv
        environment:
            ZITADEL_MASTERKEY: ${ZITADEL_MASTERKEY:?set ZITADEL_MASTERKEY (exactly 32 chars, openssl rand -hex 16) in the Portainer stack env vars}
            ZITADEL_PORT: 8080
            ZITADEL_EXTERNALDOMAIN: ${ZITADEL_HOST:?set ZITADEL_HOST (bare hostname, e.g. auth.engbjerg.com) in the Portainer stack env vars}
            ZITADEL_EXTERNALPORT: 443
            ZITADEL_EXTERNALSECURE: "true"
            ZITADEL_TLS_ENABLED: "false"
            ZITADEL_DATABASE_POSTGRES_DSN: postgresql://zitadel:${ZITADEL_DB_PASSWORD:?set ZITADEL_DB_PASSWORD (URL-safe, openssl rand -hex 24) in the Portainer stack env vars}@postgres:5432/zitadel?sslmode=disable
            ZITADEL_FIRSTINSTANCE_ORG_NAME: Engbjerg
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: admin
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${ZITADEL_ADMIN_PASSWORD:?set ZITADEL_ADMIN_PASSWORD (upper, lower, digit, symbol, 8+ chars) in the Portainer stack env vars}
            ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
            ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
            ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
            ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Automatically Initialized IAM_LOGIN_CLIENT
            ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
            ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
            ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_HOST}/ui/v2/login/
            ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_HOST}/ui/v2/login/login?authRequest=
            ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_HOST}/ui/v2/login/logout?post_logout_redirect=
        healthcheck:
            test: ["CMD", "/app/zitadel", "ready"]
            interval: 10s
            timeout: 30s
            retries: 12
            start_period: 20s
        depends_on:
            postgres:
                condition: service_healthy
        volumes:
            - zitadel_bootstrap:/zitadel/bootstrap
        # Internal port: 8080

    zitadel-login:
        image: ghcr.io/zitadel/zitadel-login:v4.17.3
        container_name: zitadel-login
        restart: unless-stopped
        user: "0"
        environment:
            ZITADEL_API_URL: http://zitadel:8080
            NEXT_PUBLIC_BASE_PATH: /ui/v2/login
            ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
            CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_HOST},X-Forwarded-Proto:https
        healthcheck:
            test:
                [
                    "CMD",
                    "/bin/sh",
                    "-c",
                    "node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy",
                ]
            interval: 10s
            timeout: 30s
            retries: 12
            start_period: 20s
        depends_on:
            zitadel:
                condition: service_healthy
        volumes:
            - zitadel_bootstrap:/zitadel/bootstrap:ro
        # Internal port: 3000

    # Reads NPM's logs and decides who to ban. The bouncer that enforces the
    # bans runs on the HOST (apt) - it needs to rewrite host iptables.
    crowdsec:
        image: crowdsecurity/crowdsec:latest
        container_name: crowdsec
        restart: unless-stopped
        environment:
            TZ: Europe/Copenhagen
            COLLECTIONS: "crowdsecurity/nginx-proxy-manager"
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - crowdsec_config:/etc/crowdsec
            - crowdsec_data:/var/lib/crowdsec/data
            - nginxproxymanager_data:/npm:ro
        configs:
            - source: crowdsec_acquis
              target: /etc/crowdsec/acquis.d/npm.yaml

    # Loads the newest .zip in the volume's saves/ dir. Game port is UDP only.
    factorio:
        image: factoriotools/factorio:stable
        pull_policy: always
        container_name: factorio
        restart: unless-stopped
        ports:
            - "34197:34197/udp"
        environment:
            TZ: Europe/Copenhagen
            DLC_SPACE_AGE: "true"
        configs:
            - source: factorio_server_settings
              target: /factorio/config/server-settings.json
        volumes:
            - factorio_data:/factorio

