services:
    nginxproxymanager:
        image: "jc21/nginx-proxy-manager:latest"
        container_name: nginxproxymanager
        restart: unless-stopped
        ports:
            - "80:80"
            - "81:81"
            - "443:443"
        volumes:
            - nginxproxymanager_data:/data
            - ./nginx/letsencrypt:/etc/letsencrypt

    ddnsupdater:
        image: qmcgaw/ddns-updater
        container_name: ddnsupdater
        restart: unless-stopped
        environment:
            - PERIOD=5m
            - 'CONFIG={"settings":[{"provider":"porkbun","domain":"engbjerg.com","host":"@","api_key":"${PORKBUN_API_KEY}","secret_api_key":"${PORKBUN_SECRET_KEY}","ip_version":"ipv4"}]}'

    watchtower:
        image: nickfedor/watchtower
        container_name: watchtower
        restart: unless-stopped
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock
        environment:
            - WATCHTOWER_CLEANUP=true
            - WATCHTOWER_POLL_INTERVAL=300
            - WATCHTOWER_LABEL_ENABLE=true

    ntfy:
        image: binwiederhier/ntfy
        container_name: ntfy
        restart: unless-stopped
        command: serve
        environment:
            TZ: Europe/Copenhagen
            NTFY_BASE_URL: https://ntfy.engbjerg.com
            NTFY_BEHIND_PROXY: "true"
            NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
            NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
            NTFY_AUTH_DEFAULT_ACCESS: deny-all
            NTFY_ENABLE_LOGIN: "true"
            NTFY_REQUIRE_LOGIN: "true"
            NTFY_ATTACHMENT_CACHE_DIR: /var/lib/ntfy/attachments
            NTFY_AUTH_USERS: ${NTFY_AUTH_USERS:?set NTFY_AUTH_USERS (user:bcrypt-hash:role) in the Portainer stack env vars}
        volumes:
            - ntfy_data:/var/lib/ntfy
        # Internal port: 80

    ntfybridge:
        image: "ghcr.io/oliverengbjerg/ntfybridge:latest"
        pull_policy: always
        container_name: ntfybridge
        restart: unless-stopped
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        environment:
            TZ: Europe/Copenhagen
            Ntfy__Token: ${NTFYBRIDGE_NTFY_TOKEN:?set NTFYBRIDGE_NTFY_TOKEN (ntfy tk_... token with write access to the github topic) in the Portainer stack env vars}
            Sources__GitHub__Token: ${NTFYBRIDGE_GITHUB_TOKEN:?set NTFYBRIDGE_GITHUB_TOKEN (GitHub classic PAT with the notifications scope) in the Portainer stack env vars}
        volumes:
            - ntfybridge_data:/data
        # Internal port: 8080 (health only, nothing to proxy)

    dashboard:
        image: "ghcr.io/oliverengbjerg/dashboard:latest"
        pull_policy: always
        container_name: dashboard
        restart: unless-stopped
        labels:
            - "com.centurylinklabs.watchtower.enable=true"
        # Internal port: 3000

    idlerpg:
        image: "ghcr.io/frederikja163/idlerpg:latest"
        pull_policy: always
        container_name: idlerpg
        restart: unless-stopped
        ports:
            - "4022:22"
            - "4000:4000"
        environment:
            - SSH_USER=${IDLERPG_SSH_USER}
            - SSH_PUBLIC_KEY=${IDLERPG_SSH_PUBLIC_KEY}
            - TLS_CERT_PATH=/certs/live/npm-2/fullchain.pem
            - TLS_KEY_PATH=/certs/live/npm-2/privkey.pem
            - ADMIN_PASSWORD=${IDLERPG_ADMIN_PASSWORD}
        volumes:
            - ./nginx/letsencrypt:/certs:ro
            - idle-rpg-data:/usr/src/idle-rpg/src/back-end/core/db

    # PINNED, and not to :latest, for two reasons found on 2026-09-19:
    #
    # 1. The running image was 10.11.6, which is vulnerable to CVE-2026-35033
    #    (CVSS 9.1): unauthenticated ffmpeg argument injection via StreamOptions
    #    on /Videos/{id}/stream, giving arbitrary file read off this host. That
    #    endpoint is reachable from the public internet through NPM with no auth
    #    at all - verified from outside the network. Fixed in 10.11.7; this is
    #    10.11.11, the last release in the 10.11 line.
    #
    # 2. :latest now resolves to Jellyfin 12.1, two major versions up. The old
    #    :latest pin was a landmine - the next "Pull and redeploy" would have
    #    jumped 10.11 -> 12 unattended and migrated the library database. Same
    #    reasoning as postgres below: major version moves stay deliberate.
    #
    # Moving to 12.x is its own project: back up the jellyfin_config volume
    # first, since the library db migration is not reversible.
    jellyfin:
        image: linuxserver/jellyfin:version-10.11.11ubu2604
        container_name: jellyfin
        restart: unless-stopped
        ports:
            - "8096:8096"
        environment:
            - PUID=1000
            - PGID=1000
            - TZ=Europe/Copenhagen
        volumes:
            - jellyfin_config:/config
            - "/media/SeagateHub/Film og serier/Film:/data/Film"
            - "/media/SeagateHub/Film og serier/Serier:/data/Serier"
            # A generated 30s h264/aac clip, added to Jellyfin as its own
            # "Healthcheck" movie library. Uptime Kuma (on the DO droplet) does
            # a ranged GET of this movie's stream URL, so the monitor fails when
            # media is actually unplayable and not just when the web server is
            # down. It lives on the SAME physical drive as the real media on
            # purpose: a copy on local disk would keep passing while the Seagate
            # fuseblk mount was gone, which is the failure this exists to catch.
            #
            # Kuma monitor (verified 2026-09-19, returns 206 + 64KB + mp4 magic):
            #   GET https://jellyfin.engbjerg.com/Videos/db5830e1096caa8f42abe21ab0fc27be/stream?static=true
            #   header  {"Range": "bytes=0-65535"}
            # The Range header matters: without it Kuma pulls all 2.4MB per poll.
            # 206 falls inside Kuma's default accepted range (200-299).
            #
            # NO API KEY - Jellyfin serves static media endpoints unauthenticated,
            # so the item id is the only credential. That is upstream behaviour,
            # not a setting here; it is also why this monitor needs no secret.
            #
            # The item id is stable until the library is removed and re-added. If
            # it ever changes, re-read it from the live library db (a COPY of it -
            # do not open the live file):
            #   /config/data/data/jellyfin.db -> SELECT Id, Name, Path FROM BaseItems
            #                                    WHERE Path LIKE '/data/Healthcheck/%'
            # then lowercase it and strip the dashes for the URL.
            #
            # Keep metadata downloaders OFF for this library - if TMDB matches it
            # to some real 1970 film, Jellyfin renames the item and re-ids it.
            #
            # Regenerate the clip with:
            #   docker run --rm -v "/media/SeagateHub/Film og serier/Healthcheck/Jellyfin Healthcheck (1970):/out" \
            #     --entrypoint /usr/lib/jellyfin-ffmpeg/ffmpeg linuxserver/jellyfin:latest \
            #     -y -f lavfi -i "testsrc2=size=640x360:rate=24:duration=30" \
            #     -f lavfi -i "sine=frequency=440:duration=30" \
            #     -c:v libx264 -preset veryfast -pix_fmt yuv420p -b:v 500k \
            #     -c:a aac -b:a 128k -ac 2 -movflags +faststart -shortest \
            #     "/out/Jellyfin Healthcheck (1970).mp4"
            - "/media/SeagateHub/Film og serier/Healthcheck:/data/Healthcheck"

    caddy:
        image: caddy:alpine
        container_name: caddy
        restart: unless-stopped
        volumes:
            - ./caddy_data:/data
            - ./caddy_config:/config
            - ./oliver-files:/usr/share/caddy
        command: caddy file-server --browse --root /usr/share/caddy --listen :80

    # CalDAV/CardDAV server. Reached via NPM at radicale:5232 (no host port).
    # Config and htpasswd users are mounted from the inline `configs:` at the bottom.
    # RADICALE_USERS is a Portainer stack env var holding a "user:bcrypt-hash" line.
    # In Portainer, wrap the value in SINGLE QUOTES ('user:$2b$12$...') - otherwise
    # Compose expands the $-parts of the hash as variables and corrupts it.
    # No read_only here: Compose injects inline configs with `docker cp`, which
    # Docker refuses on a read-only rootfs (container is left in "Created").
    radicale:
        image: tomsquest/docker-radicale:latest
        container_name: radicale
        restart: unless-stopped
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop:
            - ALL
        cap_add:
            - CHOWN
            - SETUID
            - SETGID
            - KILL
        environment:
            # Named volume already has uid 2999 ownership; skip the entrypoint's chown -R
            - TAKE_FILE_OWNERSHIP=false
        configs:
            - source: radicale_config
              target: /config/config
            - source: radicale_users
              target: /config/users
        volumes:
            - radicale_data:/data

    # PostgreSQL 18. Adopted 2026-09 from a bare `docker run` that carried no
    # compose labels, so this stack could not see or manage it, then upgraded
    # 14.21 -> 18.6 in place with pg_upgrade --link via pgautoupgrade.
    #
    # MOUNT SHAPE MATTERS. PG18 moved PGDATA from /var/lib/postgresql/data to
    # /var/lib/postgresql/<major>/docker, so the mount target is the PARENT
    # /var/lib/postgresql and the real PGDATA is .../data/18/docker on the host.
    # The host path keeps the name `data` for historical reasons - it was the
    # PG14 PGDATA before the upgrade. Do not "tidy" it without moving the
    # cluster; the image derives PGDATA from its own default, not from here.
    #
    # An ABSOLUTE HOST BIND MOUNT on purpose:
    #   * the directory holds ~246 GB of live data
    #   * a RELATIVE path would resolve against /data/compose/6, not the git
    #     checkout, and would silently initdb an EMPTY cluster
    #   * a named volume cannot be used: the old `postgres_storage` volume was
    #     on the obsolete local-persist driver and Docker will not change an
    #     existing volume's driver
    # If you ever change this path, check it twice. A wrong path does not
    # error - it initdb's a NEW EMPTY cluster instead, which is exactly what
    # happened once during the 2026-09 upgrade before the path was corrected.
    #
    # Deliberately NOT watchtower-labelled: image moves must stay manual so a
    # major version bump can never happen by surprise and eat the cluster.
    # The tag floats within 18.x so patch releases arrive on deliberate redeploy.
    postgres:
        image: postgres:18-trixie
        container_name: postgres # zitadel (stack 12) resolves this name on stack_default
        restart: unless-stopped
        # The entrypoint treats SIGTERM as a "smart" shutdown that WAITS for
        # clients to disconnect, overruns the grace period and gets SIGKILLed -
        # which is why the last restart went through crash recovery. SIGINT is a
        # fast shutdown: disconnect clients, checkpoint, exit cleanly.
        stop_signal: SIGINT
        stop_grace_period: 5m
        shm_size: 1gb # Docker's 64MB default is too small for parallel query
        ports:
            # LAN address only, NEVER 0.0.0.0. ufw does not filter Docker
            # published ports (the DOCKER-USER chain is empty), so 0.0.0.0 here
            # means "internet-exposed the moment anything forwards 5432" - which
            # is exactly how this server absorbed 202k brute-force attempts in
            # Sept 2026. 192.168.1.23 is static in /etc/netplan/99_config.yaml.
            - "192.168.1.23:5432:5432"
        environment:
            TZ: Europe/Copenhagen
            # INERT on an existing PGDATA - the entrypoint only reads this when
            # it runs initdb on an empty directory. Rotate the real password
            # with ALTER ROLE, not by changing this value.
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the Portainer stack env vars (wrap in SINGLE quotes if it contains $)}
        volumes:
            - /home/oliver/docker/postgres/data:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -q -U postgres -d postgres"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 120s

