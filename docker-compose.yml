volumes:
    nginxproxymanager_data:
    ntfy_data:
    ntfybridge_data:
    idle-rpg-data:
    jellyfin_config:
    radicale_data:
    vintagestoryserver_data:
    vintagestoryservermods_data:
    mcskyfactory5_data:
    mcstoneblock_data:

# Configs must be inline `content:` here. `file:` configs are bind mounts resolved
# against host /data/compose/6, where Portainer's git checkout does not exist.
configs:
    radicale_config:
        content: |
            [server]
            hosts = 0.0.0.0:5232

            [auth]
            type = htpasswd
            htpasswd_filename = /config/users
            htpasswd_encryption = bcrypt

            [storage]
            filesystem_folder = /data/collections

            [rights]
            type = owner_only
    # Generate a line with:
    #   docker run --rm -e U=<user> -e PW='<password>' --entrypoint /venv/bin/python tomsquest/docker-radicale:latest \
    #     -c 'import os,bcrypt;print(os.environ["U"]+":"+bcrypt.hashpw(os.environ["PW"].encode(),bcrypt.gensalt()).decode())'
    radicale_users:
        content: ${RADICALE_USERS:?set RADICALE_USERS (user:bcrypt-hash) in the Portainer stack env vars}
